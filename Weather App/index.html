<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="header">
                <div class="searchbar">
                    <input type="text" placeholder="Enter city name">
                </div>
                <div class="searchicon">
                    <button class="search-button">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
                            <line x1="16" y1="16" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="error">
                <p>Invalid city name</p>
            </div>
            <div class="main">
                <div class="icon">
                    <img src="rain.png" alt="image" class="image">
                </div>
                <div class="content">
                    <h1 class="temp">21 °c</h1>
                    <h2 class="city">New York</h2>
                </div>

            </div>
            <div class="footer">
                <div class="leftbox">
                    <div class="icon">
                        <svg width="40" height="40" viewBox="0 0 205 95" xmlns="http://www.w3.org/2000/svg" class="svg">
                            <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none">
                                <path d="M10 30 Q 25 15, 40 30 T 70 30 T 100 30 T 130 30 T 160 30 T 190 30" />
                                <path d="M10 65 Q 25 50, 40 65 T 70 65 T 100 65 T 130 65 T 160 65 T 190 65" />
                                <path d="M10 100 Q 25 85, 40 100 T 70 100 T 100 100 T 130 100 T 160 100 T 190 100" />
                            </g>
                        </svg>
                    </div>
                    <div class="data">
                        <p class="percentage">56%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="rightbox">
                    <div class="icon">
                        <svg width="40" height="40" viewBox="0 0 205 50" xmlns="http://www.w3.org/2000/svg">
                            <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none">
                                <path d="M20 40 H140 Q160 40, 160 25 Q160 10, 145 10 Q135 10, 130 20" />
                                <path d="M15 70 H170 Q190 70, 190 55 Q190 35, 170 35 Q155 35, 150 48" />
                                <path d="M20 100 H120 Q140 100, 140 85 Q140 70, 125 70 Q115 70, 110 80" />
                            </g>
                        </svg>
                    </div>
                    <div class="data">
                        <p class="percentage">5.66 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js">
       
    </script>
</body>
</html>
